name: build-test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential \
            libx11-dev libxft-dev libxinerama-dev libxcursor-dev libxfixes-dev \
            libxrender-dev libfontconfig1-dev libjpeg-dev libpng-dev zlib1g-dev

      - name: Build FLTK
        run: |
          curl -fsSL -o fltk.tar.gz \
            https://github.com/fltk/fltk/releases/download/release-1.4.5/fltk-1.4.5-source.tar.gz
          tar xf fltk.tar.gz
          cmake -S fltk-1.4.5 -B fltk-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/fltk-install" \
            -DFLTK_BUILD_TEST=OFF -DFLTK_BUILD_EXAMPLES=OFF \
            -DFLTK_BUILD_FLUID=OFF -DFLTK_BUILD_SHARED_LIBS=OFF
          cmake --build fltk-build
          cmake --install fltk-build

      - name: Configure and build
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTEXTTOOL_FLTK_PREFIX="$PWD/fltk-install"
          cmake --build build-linux

      - name: Test
        run: ./build-linux/engine_tests

      - name: Package
        run: |
          python3 tools/package.py build-linux kylin cli --out artifacts
          python3 tools/package.py build-linux kylin gui --out artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: texttool-linux
          path: artifacts/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FLTK
        shell: pwsh
        run: |
          curl.exe -fsSL -o fltk.tar.gz `
            https://github.com/fltk/fltk/releases/download/release-1.4.5/fltk-1.4.5-source.tar.gz
          tar xf fltk.tar.gz
          cmake -S fltk-1.4.5 -B fltk-build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$PWD/fltk-install" `
            -DFLTK_BUILD_TEST=OFF -DFLTK_BUILD_EXAMPLES=OFF `
            -DFLTK_BUILD_FLUID=OFF -DFLTK_BUILD_SHARED_LIBS=OFF
          cmake --build fltk-build --config Release --target INSTALL

      - name: Configure and build
        run: |
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 `
            -DTEXTTOOL_FLTK_PREFIX="$PWD/fltk-install"
          cmake --build build-windows --config Release

      - name: Test
        run: .\build-windows\Release\engine_tests.exe

      - name: Package
        run: |
          python tools/package.py build-windows/Release windows cli --out artifacts
          python tools/package.py build-windows/Release windows gui --out artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: texttool-windows
          path: artifacts/*
