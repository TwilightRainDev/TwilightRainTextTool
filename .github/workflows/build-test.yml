name: build-test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 创建 GitHub Release 需要 contents: write（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Directory.Build.props
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content -Raw Directory.Build.props
          if ($text -notmatch "<Version>$([regex]::Escape($tag))</Version>") {
            Write-Error "tag v$tag 与 Directory.Build.props 的 Version 不一致"
            exit 1
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TextTool.sln

      - name: Build
        run: dotnet build TextTool.sln -c Release --no-restore

      - name: Test
        run: dotnet test TextTool.Tests/TextTool.Tests.csproj -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.ref_name }}
          path: TextTool.Tests/TestResults/**/coverage.cobertura.xml

  # 发布：win-x64 与 linux-x64 各一套 GUI + CLI。GUI 走框架依赖发布
  # （--self-contained false），否则下载包远超 10MB；Linux 用户需自装 .NET 8 运行时。
  # 资产名一律从 scripts/github-release.ps1 的 Get-TextToolReleaseAssetNames 取，
  # 这里不另写一份名单。
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish GUI (${{ matrix.rid }})
        run: >-
          dotnet publish TextTool.Gui/TextTool.Gui.csproj -c Release -r ${{ matrix.rid }}
          --self-contained false -o publish/TextTool.Gui/${{ matrix.rid }}

      - name: Publish CLI (${{ matrix.rid }})
        run: >-
          dotnet publish TextTool.Cli/TextTool.Cli.csproj -c Release -r ${{ matrix.rid }}
          -o publish/TextTool.Cli/${{ matrix.rid }}

      - name: Sign binaries
        if: env.CODE_SIGN_CERT != ''
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
          TIMESTAMP_URL: ${{ secrets.TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $pfx = "$env:TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_CERT))
          $timestamp = if ($env:TIMESTAMP_URL) { "/tr $env:TIMESTAMP_URL" } else { "" }
          Get-ChildItem publish -Recurse -Include *.exe, *.dll |
            ForEach-Object {
              Write-Host "Signing $($_.Name)"
              & signtool sign /f $pfx /p $env:CODE_SIGN_PASSWORD $timestamp /fd SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

      - name: Package zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $rid = "${{ matrix.rid }}"
          . ./scripts/github-release.ps1
          $names = @(Get-TextToolReleaseAssetNames -Raw $version | Where-Object { $_ -like "*-$rid.zip" })
          if ($names.Count -ne 2) {
            Write-Error "名单里 $rid 应有 GUI 与 CLI 两份产物，实际 $($names.Count) 份"
            exit 1
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          foreach ($name in $names) {
            $product = if ($name -like "TextTool-GUI-*") { "TextTool.Gui" } else { "TextTool.Cli" }
            $src = "publish/$product/$rid"
            if (-not (Test-Path -LiteralPath $src)) {
              Write-Error "缺少发布目录 $src"
              exit 1
            }
            Compress-Archive -Path "$src/*" -DestinationPath "artifacts/$name"
            Write-Host "Packaged $name"
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content "$($_.FullName).sha256" "$hash  $($_.Name)"
            Write-Host "SHA256: $($_.Name) = $hash"
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/*

  # 两个 RID 的产物到齐才发 release；缺一套直接失败，不发只带 win 的版本。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: Check all RID packages present
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          . ./scripts/github-release.ps1
          $present = @(Get-ChildItem dist -File | ForEach-Object { $_.Name })
          $missing = @(Get-TextToolMissingReleaseAssets -Raw $version -Present $present)
          if ($missing.Count -gt 0) {
            Write-Error ("产物不齐，缺少：" + ($missing -join ", "))
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  # 代码质量门禁：格式合规 + 分析器警告
  code-quality:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TextTool.sln

      - name: Format check
        run: dotnet format TextTool.sln --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build TextTool.sln -c Release --no-restore -warnaserror
