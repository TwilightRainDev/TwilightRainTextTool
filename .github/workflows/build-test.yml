name: build-test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 自动构建先只做引擎、命令行与测试：界面要 FLTK，两个平台的 FLTK
# 构建还没在 Actions 上调稳，成功后另加一个界面任务，不要挡住这条主检查。
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure and build
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DTEXTTOOL_BUILD_GUI=OFF
          cmake --build build-linux

      - name: Test
        run: ./build-linux/engine_tests

      - name: Package
        run: python3 tools/package.py build-linux kylin cli --out artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: texttool-linux-cli
          path: artifacts/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 用与开发机相同的 NMake 生成器；Visual Studio 生成器在
      # windows-latest 上找不到实例时，会在配置阶段直接失败。
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        run: |
          cmake -S . -B build-windows -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DTEXTTOOL_BUILD_GUI=OFF
          cmake --build build-windows

      - name: Test
        run: .\build-windows\engine_tests.exe

      - name: Package
        run: python tools/package.py build-windows windows cli --out artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: texttool-windows-cli
          path: artifacts/*
