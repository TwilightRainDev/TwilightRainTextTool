name: build-test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 创建 GitHub Release 需要 contents: write（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Directory.Build.props
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content -Raw Directory.Build.props
          if ($text -notmatch "<Version>$([regex]::Escape($tag))</Version>") {
            Write-Error "tag v$tag 与 Directory.Build.props 的 Version 不一致"
            exit 1
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TextTool.sln

      - name: Build
        run: dotnet build TextTool.sln -c Release --no-restore

      - name: Test
        run: dotnet test TextTool.Tests/TextTool.Tests.csproj -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.ref_name }}
          path: TextTool.Tests/TestResults/**/coverage.cobertura.xml

      - name: Publish GUI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet publish TextTool.csproj -c Release -r win-x64 -o publish/TextTool
          echo "::notice::Published GUI to publish/TextTool"

      - name: Publish CLI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet publish TextTool.Cli/TextTool.Cli.csproj -c Release -r win-x64 -o publish/TextTool.Cli
          echo "::notice::Published CLI to publish/TextTool.Cli"

      - name: Sign binaries
        if: startsWith(github.ref, 'refs/tags/v') && env.CODE_SIGN_CERT != ''
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
          TIMESTAMP_URL: ${{ secrets.TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $pfx = "$env:TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_CERT))
          $timestamp = if ($env:TIMESTAMP_URL) { "/tr $env:TIMESTAMP_URL" } else { "" }
          Get-ChildItem publish -Recurse -Include *.exe, *.dll |
            ForEach-Object {
              Write-Host "Signing $($_.Name)"
              & signtool sign /f $pfx /p $env:CODE_SIGN_PASSWORD $timestamp /fd SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

      - name: Package zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path publish/TextTool/* -DestinationPath "TextTool-GUI-$version-win-x64.zip"
          Compress-Archive -Path publish/TextTool.Cli/* -DestinationPath "TextTool-CLI-$version-win-x64.zip"

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Get-ChildItem *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content "$($_.FullName).sha256" "$hash  $($_.Name)"
            Write-Host "SHA256: $($_.Name) = $hash"
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TextTool-GUI-*.zip
            TextTool-GUI-*.zip.sha256
            TextTool-CLI-*.zip
            TextTool-CLI-*.zip.sha256

  # 代码质量门禁：格式合规 + 分析器警告
  code-quality:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TextTool.sln

      - name: Format check
        run: dotnet format TextTool.sln --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build TextTool.sln -c Release --no-restore -warnaserror
